name: Sync Sprites to ZIPs

on:
  push:
    branches: [master]
    paths:
      - 'public/recursos-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install archiver

      - name: Download sprites from Drive + Create ZIPs
        run: node scripts/create-zips.js --from-drive

      - name: Upload ZIPs to sprites-v1 release
        run: |
          gh release view sprites-v1 --repo ${{ github.repository }} 2>/dev/null || \
            gh release create sprites-v1 --repo ${{ github.repository }} --title "_Sprites (auto-generated)" --notes "Auto-generated sprite ZIPs" --prerelease
          gh release upload sprites-v1 sprites-zips/*.zip --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
